<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="lockfile logo">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- shackle -->
  <path d="M42 56 V38 a20 20 0 0 1 40 0 V56" fill="none" stroke="url(#shackle)" stroke-width="11" stroke-linecap="round"/>
  <!-- page with a folded corner = lock body -->
  <path d="M26 58 a6 6 0 0 1 6 -6 H86 L102 68 V112 a6 6 0 0 1 -6 6 H32 a6 6 0 0 1 -6 -6 Z" fill="url(#body)"/>
  <path d="M86 52 V64 a4 4 0 0 0 4 4 H102 Z" fill="url(#fold)"/>
  <!-- keyhole -->
  <circle cx="64" cy="84" r="7" fill="#0F172A"/>
  <path d="M60.5 87 L58.5 100 H69.5 L67.5 87 Z" fill="#0F172A"/>
</svg>
