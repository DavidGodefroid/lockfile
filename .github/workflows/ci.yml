name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    # The sandbox and end-to-end tests need Landlock and seccomp from the kernel.
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go vet (darwin)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: go test (managed configuration)
        run: go test -count=1 -tags lockfamily_managed_test ./...
      - name: go test (integration)
        run: go test -count=1 -tags 'integration lockfamily_managed_test' ./test/integration/...

  docker:
    name: docker (image, sandbox under the shipped seccomp profile, end to end)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: |
          docker build -t lockfile:e2e --build-arg VERSION=ci .
          docker build -t lockfile:e2e-allowed --build-arg VERSION=ci --build-arg ALLOWED_UIDS=4242 .
      - name: ALLOWED_UIDS refuses root, the console account, nobody, bad lists
        run: |
          for bad in '1,,2' '0' '1000,0' '10031' '007' '65534' 'x'; do
            if docker build --build-arg ALLOWED_UIDS="$bad" . >/dev/null 2>&1; then echo "ALLOWED_UIDS=$bad accepted" >&2; exit 1; fi
          done
      - name: sandbox tests in a container under seccomp.json
        # The build stage's image: the same Go, the same kernel interfaces
        # the console's container gets.
        run: |
          go_image=$(sed -n 's/^FROM \(docker.io\/library\/golang:[^ ]*\) AS build$/\1/p' Dockerfile)
          docker run --rm --security-opt seccomp="$PWD/seccomp.json" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CGO_ENABLED=0 -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod \
            -v "$PWD:/src:ro" -w /src "$go_image" go test -count=1 ./sandbox/
      - name: the launcher runs every command in the image
        run: |
          set -x
          docker tag lockfile:e2e lockfile
          sh scripts/lockfile version | grep -x 'lockfile launcher dev (image lockfile)'
          mkdir -p "$RUNNER_TEMP/proj/.git" && cd "$RUNNER_TEMP/proj"
          sh "$GITHUB_WORKSPACE/scripts/lockfile" init claude
          grep -Eq '"command": ?"lockfile"' .mcp.json
          test "$(stat -c %u .mcp.json)" = "$(id -u)"
          sh "$GITHUB_WORKSPACE/scripts/lockfile" doctor | grep -q 'sandbox'
          # No lox run here: no console's socket to mount (exit 2, as a client
          # that finds no console), never the fixed lockfile-run instead; no
          # console home for the plugins either.
          code=0; sh "$GITHUB_WORKSPACE/scripts/lockfile" sources 2>err || code=$?
          test "$code" = 2 && grep -q 'no .lockfamily/up.json' err
          code=0; sh "$GITHUB_WORKSPACE/scripts/lockfile" plugin list 2>err || code=$?
          test "$code" = 2 && grep -q 'no .lockfamily/up.json' err
          code=0; sh "$GITHUB_WORKSPACE/scripts/lockfile" install 2>err || code=$?
          test "$code" = 1 && grep -q 'runs in Docker' err
      - name: the profile and the plugins reach the console lox run starts (lockfile#44)
        # lox run's side, as lockhub's internal/family makes it: up.json, the
        # volumes with compose's labels, the reviewed profile copy unpacked
        # by root for the console's account (its profile-lockfile service).
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/ws/.lockfamily" && cd "$RUNNER_TEMP/ws" && ws=$(pwd -P)
          lf="$GITHUB_WORKSPACE/scripts/lockfile"
          sh "$lf" profile add --profile samples --source local --path /srv/lockfile/samples | grep -q "$ws/.lockfile/config.toml"
          # A profile already there is kept: code exists, one JSON line.
          out=$(sh "$lf" profile add --non-interactive --json --profile samples --source local --path /srv/x) && exit 1
          printf '%s\n' "$out" | grep -qx '{"lock":"lockfile","code":"exists",.*}'
          test "$(stat -c '%u %a' .lockfile)" = "$(id -u) 700"
          test "$(stat -c '%u %a' .lockfile/config.toml)" = "$(id -u) 600"
          grep -qx '\[profiles.samples\]' .lockfile/config.toml
          p="lockfamily-$(printf '%s' "$ws" | sha256sum | cut -c1-8)"
          docker volume create --label com.docker.compose.project="$p" --label com.docker.compose.volume=files-run \
            --label dev.lockfamily.role=socket --label dev.lockfamily.instance=files --label dev.lockfamily.type=lockfile \
            --label dev.lockfamily.workspace="$ws" "${p}_files-run"
          for v in files-home profile-lockfile; do
            docker volume create --label com.docker.compose.project="$p" --label com.docker.compose.volume="$v" "${p}_$v"
          done
          tar -C .lockfile -c . | docker run --rm -i --user 0:0 --network none -v "${p}_profile-lockfile:/p" --entrypoint /bin/sh lockfile \
            -c 'tar -x -C /p && chown -R 10031:10030 /p && chmod 0700 /p'
          printf '{\n  "version": 1,\n  "project": "%s",\n  "workspace": "%s",\n  "hub_network": "%s_lockhub",\n  "hub_url": "http://lockhub:8443",\n  "hub_key": "",\n  "lockhttp_gate": 1,\n  "locks": {\n    "files": {\n      "type": "lockfile",\n      "socket_volume": "%s_files-run",\n      "client_gid": "10030"\n    }\n  }\n}\n' \
            "$p" "$ws" "$p" "$p" > .lockfamily/up.json
          # The console account's commands see the profile lox run copied, and
          # keep their state in the console's own home.
          sh "$lf" doctor | grep -q '1 profile(s)'
          sh "$lf" plugin list | grep -q 'no plugin installed'
          docker run --rm --user lockfile --network none -v "${p}_files-home:/home/lockfile" --entrypoint /bin/sh lockfile -c 'test -w /home/lockfile'
          # A lock's home that lox run did not make is refused.
          docker volume rm "${p}_files-home" && docker volume create "${p}_files-home"
          code=0; sh "$lf" plugin list 2>err || code=$?
          test "$code" = 2 && grep -q "is not lox run's" err
          docker volume rm "${p}_files-run" "${p}_files-home" "${p}_profile-lockfile"
      - name: end to end (docs/docker.md)
        run: go test -count=1 -v -tags docker ./test/docker/...

  lint:
    name: lint (staticcheck, govulncheck, actionlint)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags 'integration lockfamily_managed_test' ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags integration ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
