name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    # The sandbox and end-to-end tests need Landlock and seccomp from the kernel.
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go vet (darwin)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: go test (integration)
        run: go test -count=1 -tags integration ./test/integration/...

  docker:
    name: docker (image, sandbox under the shipped seccomp profile, end to end)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: |
          docker build -t lockfile:e2e --build-arg VERSION=ci .
          docker build -t lockfile:e2e-allowed --build-arg VERSION=ci --build-arg ALLOWED_UIDS=4242 .
      - name: ALLOWED_UIDS refuses root, the console account, nobody, bad lists
        run: |
          for bad in '1,,2' '0' '1000,0' '10031' '007' '65534' 'x'; do
            if docker build --build-arg ALLOWED_UIDS="$bad" . >/dev/null 2>&1; then echo "ALLOWED_UIDS=$bad accepted" >&2; exit 1; fi
          done
      - name: sandbox tests in a container under seccomp.json
        # The build stage's image: the same Go, the same kernel interfaces
        # the console's container gets.
        run: |
          go_image=$(sed -n 's/^FROM \(docker.io\/library\/golang:[^ ]*\) AS build$/\1/p' Dockerfile)
          docker run --rm --security-opt seccomp="$PWD/seccomp.json" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CGO_ENABLED=0 -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod \
            -v "$PWD:/src:ro" -w /src "$go_image" go test -count=1 ./sandbox/
      - name: the launcher runs every command in the image
        run: |
          set -x
          docker tag lockfile:e2e lockfile
          sh scripts/lockfile version | grep -x 'lockfile launcher dev (image lockfile)'
          mkdir -p "$RUNNER_TEMP/proj/.git" && cd "$RUNNER_TEMP/proj"
          sh "$GITHUB_WORKSPACE/scripts/lockfile" init claude
          grep -Eq '"command": ?"lockfile"' .mcp.json
          test "$(stat -c %u .mcp.json)" = "$(id -u)"
          sh "$GITHUB_WORKSPACE/scripts/lockfile" plugin list
          sh "$GITHUB_WORKSPACE/scripts/lockfile" doctor | grep -q 'sandbox'
          sh "$GITHUB_WORKSPACE/scripts/lockfile" sources | grep -q 'no lockfile console is running'
          code=0; sh "$GITHUB_WORKSPACE/scripts/lockfile" install 2>err || code=$?
          test "$code" = 1 && grep -q 'runs in Docker' err
          docker volume rm lockfile-home lockfile-run
      - name: end to end (docs/docker.md)
        run: go test -count=1 -v -tags docker ./test/docker/...

  lint:
    name: lint (staticcheck, govulncheck, actionlint)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags integration ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags integration ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
