name: official-index

# The official marketplace's index, as lockfile installs from it:
# OfficialIndexURL answers 200, its signature verifies against the identity
# pinned in internal/verify, and file.non-empty@1.0.0 is listed (lockfile#61).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: official index (200, signature)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # as the marketplace: the bundle format lockfile verifies
      - name: verify the official index
        run: go test -count=1 -v -tags official -run TestOfficialIndexPublished ./internal/marketplace/
